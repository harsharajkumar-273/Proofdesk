name: Auto Assign Issue

on:
  issue_comment:
    types: [created]

jobs:
  assign:
    runs-on: ubuntu-latest
    if: (!github.event.issue.pull_request) && (contains(github.event.comment.body, '.take') || contains(github.event.comment.body, 'i want to work on this'))
    permissions:
      issues: write
    steps:
      - name: Assign contributor
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.issue.number;
            
            console.log(`Assigning issue #${issueNumber} to user ${commenter}...`);
            
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: [commenter]
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Hi @${commenter}, you have been successfully assigned to this issue! Happy coding 🚀`
            });
