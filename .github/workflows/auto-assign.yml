name: Auto Assign Issue

on:
  issue_comment:
    types: [created, edited]

jobs:
  assign:
    runs-on: ubuntu-latest
    if: !github.event.issue.pull_request
    permissions:
      issues: write
    steps:
      - name: Assign contributor
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commenter = context.payload.comment.user.login;
            const body = context.payload.comment.body.toLowerCase();
            const issueNumber = context.issue.number;
            
            // Define trigger keywords / phrases (case-insensitive checks)
            const triggers = [
              '.take',
              '/take',
              'assign me',
              'assign this',
              'assign it to me',
              'can you assign me',
              'i want to work',
              'i\'d like to work',
              'i would like to work',
              'like to work',
              'want to work',
              'work on this',
              'work on it'
            ];
            
            const isTriggered = triggers.some(trigger => body.includes(trigger));
            
            if (isTriggered) {
              console.log(`Assigning issue #${issueNumber} to user ${commenter}...`);
              
              // Assign the user
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: [commenter]
              });
              
              // Reply confirming the assignment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `Hi @${commenter}, you have been successfully assigned to this issue! Happy coding 🚀`
              });
            } else {
              console.log(`Comment by ${commenter} did not match any auto-assignment triggers.`);
            }
