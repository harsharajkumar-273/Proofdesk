name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENABLE_LOCAL_TEST_MODE: "true"
      LOCAL_TEST_TOKEN: local-test
      LOCAL_TEST_REPO_OWNER: demo
      LOCAL_TEST_REPO_NAME: course-demo
      LOCAL_TEST_REPO_PATH: ./test-repo/course-demo
      FRONTEND_URL: http://127.0.0.1:4173
      PROOFDESK_SESSION_SECRET: ci-session-secret
      PROOFDESK_DATA_DIR: ./.tmp/proofdesk-ci
    steps:
      - uses: actions/checkout@v6

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects
        continue-on-error: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: npm ci --prefix backend

      # The backend imports PrismaClient at startup. The client is generated code,
      # not committed, so without this step every test file that loads the server
      # fails with "does not provide an export named 'PrismaClient'".
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Verify runtime configuration
        run: npm run verify:env

      - name: Run tests
        run: npm test

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  # Drives the real editor in Chromium against the local demo repository: the
  # failed-build explanation flow, the editor layout, and the demo workspace.
  # None of it needs Docker or GitHub; Pyodide is stubbed by the tests.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROOFDESK_SESSION_SECRET: ci-session-secret
      PROOFDESK_DATA_DIR: ./.tmp/proofdesk-e2e
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Prepare the database
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma db push

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
