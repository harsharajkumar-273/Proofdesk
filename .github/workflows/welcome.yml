name: Welcome First Time Contributors

on:
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Welcome message
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Welcome @${{ github.actor }}! Thank you for opening a pull request to Proofdesk 🎉
            
            We are glad to have you participating in our Summer of Code program!
            
            Please make sure you have:
            - Starred and forked this repository (our verification workflow will check this).
            - Followed the guidelines in [CONTRIBUTING.md](https://github.com/harsharajkumar-273/Proofdesk/blob/main/CONTRIBUTING.md).
            - Filled out the PR checklist in your description.
            
            One of the maintainers will review your changes shortly! Happy coding! 🚀
