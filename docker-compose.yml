services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - redis

  ila-live:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: mra-pretext-builder
    container_name: ila-live-preview
    command: ["watch", "/repo", "/output", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - ${ILA_REPO_PATH:-./builds/ila-repo}:/repo
      - ./builds/output:/output
      - pretex-cache:/home/vagrant/cache
      - vagrant-build:/home/vagrant/build
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: proofdesk-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pretex-cache:
  vagrant-build:
